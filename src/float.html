<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", "Noto Sans SC", "PingFang SC", sans-serif;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .float-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 1.5rem;
            width: 280px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            animation: floatIn 0.5s ease;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .float-container.visible {
            opacity: 1;
        }

        @keyframes floatIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .word {
            font-size: 1.8rem;
            font-weight: 700;
            color: #4a90d9;
            text-align: center;
            margin-bottom: 0.8rem;
        }

        .meaning {
            font-size: 1.1rem;
            color: #333;
            text-align: center;
            line-height: 1.5;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .meaning.revealed {
            opacity: 1;
        }

        .hint {
            font-size: 0.8rem;
            color: #999;
            text-align: center;
            margin-top: 0.8rem;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e9ecef;
            border-radius: 2px;
            margin-top: 1rem;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4a90d9, #357abd);
            width: 0%;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>
    <div class="float-container" id="container">
        <div class="word" id="word">Loading...</div>
        <div class="meaning" id="meaning">意思将在几秒后显示...</div>
        <div class="hint">点击窗口关闭</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>
    </div>

    <script>
        const data = window.__float_data || { word: 'Word', meaning: 'Meaning', delay: 3 };

        document.getElementById('word').textContent = data.word;

        let elapsed = 0;
        const delay = (data.delay || 3) * 1000;
        const interval = 100;

        const progress = document.getElementById('progress');
        const meaning = document.getElementById('meaning');

        setTimeout(() => {
            document.getElementById('container').classList.add('visible');
        }, 100);

        setInterval(() => {
            elapsed += interval;
            const percent = Math.min((elapsed / delay) * 100, 100);
            progress.style.width = percent + '%';

            if (elapsed >= delay) {
                meaning.textContent = data.meaning;
                meaning.classList.add('revealed');
            }
        }, interval);

        document.getElementById('container').addEventListener('click', () => {
            const { getCurrentWindow } = window.__TAURI__.core;
            getCurrentWindow().close();
        });
    </script>
</body>
</html>
